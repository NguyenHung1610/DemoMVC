name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish project
        run: dotnet publish DemoMVC.csproj -c Release -o ./publish

      # Tắt server để giải phóng file lock (.dll)
      - name: ⛔ Stop Server (Upload app_offline.htm)
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" || true

      # Deploy với cấu hình chia sẻ file bị lock
      - name: 🚀 Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          force-sharing: true
          exclude: |
            **/app_offline.htm

      # Bật lại server bằng cách xóa app_offline.htm
      - name: ▶️ Start Server (Delete app_offline.htm)
        if: always()
        run: |
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true